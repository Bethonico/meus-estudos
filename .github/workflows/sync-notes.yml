name: Sincronizar anotações do Notion

on:
  schedule:
    # Roda todo dia à 03:00 UTC (ajuste o horário se quiser).
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar sincronização
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python scripts/sync_notion_to_github.py

      - name: Commitar mudanças (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estudos/
          if git diff --cached --quiet; then
            echo "Nada novo pra commitar hoje."
          else
            git commit -m "Sync automático das anotações de estudo ($(date -u +'%Y-%m-%d'))"
            git push
          fi